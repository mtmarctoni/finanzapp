name: Dependabot Age Retry

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Manually retry a specific Dependabot PR by number'
        required: false

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-age-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Find and retry aged Dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MANUAL_PR: ${{ inputs.pr_number }}
        run: bash scripts/ci/retry-dependabot.sh
