allowBuilds:
  bufferutil: true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - npm-run-all2@9.0.0
trustPolicy: strict
overrides:
  'ws@<8.21.0': 8.21.0
  'brace-expansion@1': ^1.1.20
  'brace-expansion@2': ^2.1.6
  'form-data@>=4.0.0 <4.0.6': ^4.0.6
  'js-yaml@3': ^3.15.1
  'js-yaml@4': ^4.3.1
  '@eslint/plugin-kit@<0.3.4': ^0.3.4
  'brace-expansion@>=4.0.0 <5.0.11': ^5.0.11
  'sharp@<0.35.5': ^0.35.5
  'shell-quote@<1.11.0': ^1.11.0
  'source-map-js@<1.2.2': ^1.2.2
  # 2026-10-24: the parents accept the fixed releases, but `pnpm update` does
  # not move these transitive copies, so pin the floor here.
  # handlebars: GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f, GHSA-xw65-4hp5-5hc7
  # undici: GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472
  # zod: GHSA-mrhx-c7xc-m3w5 (the copy eslint-plugin-react-hooks pulls in);
  # zod 3 is left alone on purpose, since forcing it to 4 would break callers.
  'handlebars@<4.7.10': ^4.7.10
  'undici@>=6.7.0 <6.29.1': ^6.29.1
  'undici@>=7.0.0 <7.30.1': ^7.30.1
  'zod@>=4.0.0 <4.6.6': ^4.6.6
  # fast-uri: GHSA-w74x-v6f9-j3xg, GHSA-xhq7-xmqj-769h,
  # GHSA-wjr9-j795-jxcr and GHSA-333x-w4r6-6crp (via ajv).
  'fast-uri@>=3.0.0 <3.1.9': ^3.1.9
