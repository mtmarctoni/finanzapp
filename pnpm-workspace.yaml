allowBuilds:
  bufferutil: true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - npm-run-all2@9.0.0
trustPolicy: strict
overrides:
  'ws@<8.21.0': 8.21.0
  'brace-expansion@1': ^1.1.20
  'brace-expansion@2': ^2.1.6
  'form-data@>=4.0.0 <4.0.6': ^4.0.6
  'js-yaml@3': ^3.15.1
  'js-yaml@4': ^4.3.1
  '@eslint/plugin-kit@<0.3.4': ^0.3.4
  'brace-expansion@>=4.0.0 <5.0.11': ^5.0.11
  'sharp@<0.35.5': ^0.35.5
  'shell-quote@<1.11.0': ^1.11.0
  'source-map-js@<1.2.2': ^1.2.2
  'undici@>=6.7.0 <6.28.1': ^6.28.1
auditConfig:
  # No patched release exists yet for these, so overrides cannot fix them.
  # Both are dev-only and only see patterns and templates from this repo's own
  # tooling config. Remove each entry once its fix is published.
  ignoreGhsas:
    # braces <=3.0.3 (latest), via micromatch in jest, eslint and semantic-release
    - GHSA-vfj7-8cjw-p6xm
    # handlebars <=4.7.9 (latest), via semantic-release's changelog writer
    - GHSA-8r5x-fm3f-whwj
    - GHSA-p8wg-vrv2-v86f
